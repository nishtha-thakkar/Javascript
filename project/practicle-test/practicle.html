  <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 md:p-8">

<div class="max-w-7xl mx-auto">

    <div class="bg-white p-5 rounded-lg shadow mb-8">

        <h2 class="text-2xl font-bold mb-4">
            Add / Update Product
        </h2>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

            <input type="text" id="title"
            placeholder="Product Title"
            class="border p-3 rounded w-full">

            <input type="number" id="price"
            placeholder="Product Price"
            class="border p-3 rounded w-full">

            <input type="text" id="image"
            placeholder="Image URL"
            class="border p-3 rounded w-full">

            <input type="text" id="category"
            placeholder="Category"
            class="border p-3 rounded w-full">

        </div>

        <div class="flex flex-col md:flex-row gap-3 mt-4">

            <button id="addBtn"
            class="bg-green-500 text-white px-5 py-2 rounded w-full md:w-auto">
                Add Product
            </button>

            <button id="updateBtn"
            class="bg-blue-500 text-white px-5 py-2 rounded w-full md:w-auto">
                Update Product
            </button>

            <button id="lowToHigh"
            class="bg-purple-500 text-white px-5 py-2 rounded w-full md:w-auto">
                Low To High
            </button>

            <button id="highToLow"
            class="bg-pink-500 text-white px-5 py-2 rounded w-full md:w-auto">
                High To Low
            </button>

        </div>

        <div class="flex flex-col md:flex-row gap-3 mt-4">

            <input
            type="text"
            id="search"
            placeholder="Search Product"
            class="border p-3 rounded flex-1">

            <button
            id="searchBtn"
            class="bg-black text-white px-5 py-2 rounded">
                Search
            </button>

        </div>

    </div>

    <div
    id="products"
    class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
    </div>

</div>

<script src="practicle.js"></script>

</body>
</html>
