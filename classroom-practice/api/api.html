<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
  #container {
    display: flex;
    flex-wrap: wrap;
    gap: 20px; 
    justify-content: center; 
    padding: 20px;
  }

  #container div {
    border: 1px solid #ccc;
    border-radius: 10px;
    padding: 15px;
    width: 220px;
    text-align: center;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    gap: 10px;
  }

  #container img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    border-radius: 8px;
  }

  
</style>
</head>
<body>
    <div id="container"></div>
   <script src="api.js"></script> 
</body>
</html>
